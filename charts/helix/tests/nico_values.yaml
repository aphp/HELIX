# Default values for the helix.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Custom Helm Release name.
# @section -- Helm Release settings
nameOverride: ""

# -- Custom Helm Release full name.
# @section -- Helm Release settings
fullnameOverride: ""

# -- HELIX settings.
# @section -- HELIX settings
# @default -- Configuration fitting a standard context
configuration:
  # -- HELIX settings regarding JupyterHub.
  # @section -- HELIX settings
  # @default -- JupyterHub configuration override fitting a standard context
  jupyterhub:
    # -- HELIX settings regarding Jupyter Notebbok Singleuser (jovyan user inside pods).
    # @section -- HELIX settings
    # @default -- No override of existing Z2JHK8S Chart Configuration.
    singleuser:
      # -- Supports UID/GID manipulation to match custom volume persmisisons
      # @section -- HELIX settings
      # @default -- No override of existing Z2JHK8S Chart Configuration.
      ownership:
        # -- Overrides the default "jovyan" user UID
        # @section -- HELIX settings
        uidOverride: 1000
        # -- Overrides the default "jovyan" group UID
        # @section -- HELIX settings
        gidOverride: 100
        # -- Extra group binding for the default user (jovyan). Must be an array of GIDs of form [123,456]
        # @section -- HELIX settings
        addToGroups: []
        #- 123
        #- 543

    # -- Specifies JupyterHub's available profile, containing the notebook's docker images.
    # @section -- HELIX settings
    # @default -- Single-ser and collaborative profiles fitting an standard context.
    profiles:
      # -- Single-user profiles, used when a user spawns his own JLab environment.
      # @section -- HELIX settings
      # @default -- APHP EDS Base and OCAML notebook profiles, alongside Jupyter Project official 
      #             minimal and datascience notebooks
      user: 
        # configuration.jupyterhub.profiles.user[0].displayName -- Profile's name to be display to the user.
        # @section -- HELIX settings
        - displayName: "Jupyter EDS Base Notebook"
          # configuration.jupyterhub.profiles.user[0].slug -- Profile's slug.
          # @section -- HELIX settings
          slug: "eds-base-notebook"
          # configuration.jupyterhub.profiles.user[0].image -- Image to be used with that profile.
          # @section -- HELIX settings
          image: "ghcr.io/aphp/base-eds-notebook:x86_64-ubuntu-24.04"
          # configuration.jupyterhub.profiles.user[0].imagePullPolicy -- Image's Pull Policy.
          # @section -- HELIX settings
          imagePullPolicy: "Always"
          cpu_limit: "3"
          cpu_guarantee: "1"
          memory_limit: "8G"
          memory_guarantee: "4G"

      # -- Collaboration profiles, used when a user spawns a collaborative JLab.
      # @section -- HELIX settings
      # @default -- APHP EDS Base and OCAML notebook profiles.
      collaboration:
        # configuration.jupyterhub.profiles.collaboration[0].displayName -- Image name to be displayed in the profile list.
        # @section -- HELIX settings
        - displayName: "Jupyter EDS Base Notebook"
          # configuration.jupyterhub.profiles.collaboration[0].slug -- Profile's slug.
          # @section -- HELIX settings
          slug: "eds-base-notebook"
          # configuration.jupyterhub.profiles.collaboration[0].image -- Image to be used with that profile.
          # @section -- HELIX settings
          image: "ghcr.io/aphp/base-eds-notebook:x86_64-ubuntu-24.04"
          # configuration.jupyterhub.profiles.collaboration[0].imagePullPolicy -- Image's Pull Policy.
          # @section -- HELIX settings
          imagePullPolicy: "Always"

# Settings related to persistence management across the Datalab's applications.
persistence:
  # -- Creates PVCs to be used across the Datalab's applications.
  # @section -- Datalab persistence settings
  # @default -- HDD and SSD Data PVCs
  createPVC:
  # persistence.createPVC[0].name -- Name of the PVC to create.
  # @section -- Datalab persistence settings
  - name: data-hdd-pvc
    # persistence.createPVC[0].storageClassName -- StorageClass of the PVC to create.
    # @section -- Datalab persistence settings
    storageClassName: "standard"
    # persistence.createPVC[0].accessMode -- AccessMode of the PVC to create.
    # @section -- Datalab persistence settings
    accessMode: "ReadWriteOnce"
    # persistence.createPVC[0].size -- Size of the PVC to create.
    # @section -- Datalab persistence settings
    size: "5Gi"
  - name: data-ssd-pvc 
    storageClassName: "standard"
    accessMode: "ReadWriteOnce"
    size: "5Gi"

# -- Settings related to persistence management across the Datalab's applications.
# @section -- Datalab serviceAccount settings
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# -- JupyterHub Chart settings.
# @section -- JupyterHub Chart settings
# @default -- Exposing a local Jupyterhub instance on /jupyter
jupyterhub:
  enabled: true

  nameOverride: "datalab-jupyter"

  debug:
    enabled: false

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/app-root: "/jupyter"
    hosts:
    - "localhost"
    tls: []

  hub:
    image:
      pullPolicy: "Always"
    baseUrl: "/jupyter"
    db:
      type: "sqlite-pvc"
      upgrade:
      pvc:
        annotations: {}
        selector: {}
        accessModes:
          - "ReadWriteOnce"
        storage: "2Gi"
        storageClassName: "standard"

    config:
      Authenticator:
        admin_users:
          - "admin" 
        allowed_users:
          - "datalab-local"
          - "user1"
          - "user2"

      DummyAuthenticator:
        password: "supersecretpassword"
      JupyterHub:
        authenticator_class: "dummy"

    extraEnv:
      PROJECT: "datalab-local"
      JHUB_DEFAULT_URL: "/jupyter/hub/spawn/datalab-local"

    redirectToServer: false

    extraVolumeMounts:
      - name: "extra-config"
        mountPath: "/usr/local/etc/jupyterhub/jupyterhub_config.d"

    extraVolumes:
      - name: "extra-config"
        configMap:
          name: "jupyterhub-extra-config"

      
  scheduling:
    userScheduler:
      enabled: false
    podPriority:
      enabled: false
    userPlaceholder:
      enabled: false

  proxy:
    service:
      type: "ClusterIP"

  prePuller:
    continuous:
      enabled: false
    hook:
      enabled: false

  cull:
    enabled: true
    timeout: 3600
    every: 300

  singleuser:
    podNameTemplate: "isd-{unescaped_username}"

    extraEnv:
      PYDEVD_DISABLE_FILE_VALIDATION: "1"

    storage:
      dynamic:
        storageClass: "standard"
        storageAccessModes:
        - "ReadWriteOnce"
      capacity: "5Gi"

      extraVolumeMounts:
      - name: "datalab-data-hdd"
        mountPath: "/data/hdd"
      - name: "datalab-data-ssd"
        mountPath: "/data/ssd"

      extraVolumes:
      - name: "datalab-data-hdd"
        persistentVolumeClaim:
          claimName: "data-hdd-pvc"
      - name: "datalab-data-ssd"
        persistentVolumeClaim:
          claimName: "data-ssd-pvc"
        

    lifecycleHooks:
      postStart:
        exec:
          command:
          - "sh"
          - "-c"
          - "if [ -d /tmp/home ]; then cp -rf /tmp/home/.[^.]* /home/jovyan/; fi"

    cpu:
      limit: 2
      guarantee: 1
    memory:
      limit: "8G"
      guarantee: "4G"
